[project]
name = "finalproject-ulyankin-m26-555"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mypricelessfriend", email = "nikitaulankin17@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "prettytable>=3.9.0",
]

[project.scripts]
valutatrade = "valutatrade_hub.cli.interface:main"

[dependency-groups]
