[project]
name = "finalproject-ulyankin-M26-555"
version = "0.4.0"
description = "ValutaTrade Hub — консольный симулятор валютного кошелька"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "prettytable>=3.9.0",
    "requests>=2.31.0",
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.scripts]
valutatrade = "valutatrade_hub.cli.interface:main"

[dependency-groups]
dev = [
    "ruff>=0.5.0",
]

[tool.valutatrade]
RATES_TTL_SECONDS = 300
DEFAULT_BASE_CURRENCY = "USD"
LOG_LEVEL = "INFO"
LOG_FORMAT = "text"
LOG_MAX_BYTES = 1000000
LOG_BACKUP_COUNT = 3

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["valutatrade_hub"]